name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-controller-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Windows controller semantics and fake app-server
        run: cargo test --locked
      - name: Build Windows application
        run: cargo build --locked
      - uses: actions/upload-artifact@v4
        with:
          name: omegag-windows
          path: target/debug/ds4cc.exe

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --verbose

      - name: Enable uinput for headless input tests
        run: |
          sudo modprobe uinput
          # The virtual-device tests create/read uinput devices; udev's
          # default rule makes /dev/uinput root-only, so open it up for
          # the test run (CI-only, ephemeral runner).
          sudo chmod a+rw /dev/uinput
          # Newly created event nodes also need read access for evdev enumeration.
          # This rule exists only on the disposable CI runner.
          echo 'SUBSYSTEM=="input", KERNEL=="event*", MODE="0666"' | sudo tee /etc/udev/rules.d/99-omegag-ci.rules
          sudo udevadm control --reload-rules
          ls -l /dev/uinput

      - name: Run test suite
        run: cargo test --verbose -- --nocapture

  website-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Website accuracy checks
        run: node website/checks.mjs
